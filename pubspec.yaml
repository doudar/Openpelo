name: openpelo
description: "Your Machine, Your Apps"
publish_to: 'none'
version: 1.0.77

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  archive: ^4.2.0
  crypto: ^3.0.7
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_adb:
    git:
      url: https://github.com/doudar/flutter_adb.git
  http: ^1.6.0
  intl: ^0.20.3
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  multicast_dns: ^0.3.3+1
  network_info_plus: ^8.2.1
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/Icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "images/Icon.png"
    background_color: "#ffffff"
    theme_color: "#B31942"
  windows:
    generate: true
    image_path: "images/Icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "images/Icon.png"

flutter:
  uses-material-design: true
  assets:
    - apps_config.json
    - usb_debug_steps.json
    - wireless_adb_steps.json
    - ADB/
    - assets/scrcpy/scrcpy-server-v3.3.4
    - THIRD_PARTY_NOTICES.md
    - assets/licenses/
